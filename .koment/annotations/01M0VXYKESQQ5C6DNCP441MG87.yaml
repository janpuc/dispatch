  target:
    file: internal/controller/session_controller.go
  type: why
  body: |-
    Token and cost history is published here, from the result the runner
    harvested, rather than from provider telemetry. Claude Code can export its
    own OTel metrics, but that needs an OTLP collector this cluster does not
    run, and it reports nothing useful when the session is subscription-billed.
    Reading the numbers off the CLI's final result line means the fleet answers
    "what would this have cost on API pricing" (ADR-0004) on any billing mode,
    with Prometheus as the only dependency. These counters live in operator
    memory, so they reset when the operator restarts — Session objects remain
    the durable record.
