---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - dispatch.janpuc.com
  resources:
  - agents
  - triggers
  - workspaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dispatch.janpuc.com
  resources:
  - sessions
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dispatch.janpuc.com
  resources:
  - sessions/status
  - triggers/status
  - workspaces/status
  verbs:
  - get
  - patch
  - update
