---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-operator
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-operator
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-operator
subjects:
  - kind: ServiceAccount
    name: dispatch-operator
    namespace: {{ .Release.Namespace }}
