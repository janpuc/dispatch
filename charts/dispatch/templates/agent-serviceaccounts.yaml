{{- if .Values.agentServiceAccounts.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-agent-readonly
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-agent-readonly
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: dispatch-agent-readonly
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-agent-minimal
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
