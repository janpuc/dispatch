{{- if .Values.agentServiceAccounts.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-agent-readonly
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-agent-readonly
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: dispatch-agent-readonly
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-agent-minimal
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.agentServiceAccounts.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-agent-coordinator
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-agent-coordinator
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: dispatch-agent-coordinator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatch-agent-coordinator
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dispatch.janpuc.com"]
    resources: ["sessions"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["dispatch.janpuc.com"]
    resources: ["agents", "triggers", "workspaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatch-agent-coordinator
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatch-agent-coordinator
subjects:
  - kind: ServiceAccount
    name: dispatch-agent-coordinator
    namespace: {{ .Release.Namespace }}
{{- end }}
